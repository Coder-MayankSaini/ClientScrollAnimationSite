[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public,max-age=31536000,immutable"

[[headers]]
  for = "/pictures/*"
  [headers.values]
    Cache-Control = "public,max-age=31536000,immutable"

[[headers]]
  for = "/music/*"
  [headers.values]
    Cache-Control = "public,max-age=31536000,immutable"
